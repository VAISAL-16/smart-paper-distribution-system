version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      MONGO_URL: mongodb://mongo:27017/smart_exam_db
      NODE_ENV: production

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  mongo_data:
